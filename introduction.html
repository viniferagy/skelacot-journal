<script>
(() => {
  const status = document.getElementById('status');
  const form = document.getElementById('unlock');
  const decode = value => Uint8Array.from(atob(value.replace(/-/g, '+').replace(/_/g, '/')), char => char.charCodeAt(0));
  async function openPanel(value) {
    try {
      const token = value.includes('#') ? new URLSearchParams(value.split('#')[1]).get('key') : value;
      if (!token || !/^[A-Za-z0-9_-]{43}$/.test(token)) throw new Error('key');
      if (!window.crypto?.subtle) throw new Error('browser');
      const payload = JSON.parse(document.getElementById('encrypted-panel').textContent);
      const key = await crypto.subtle.importKey('raw', decode(token), 'AES-GCM', false, ['decrypt']);
      const html = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(payload.iv) }, key, decode(payload.ciphertext));
      // The isolated frame cannot read the access key in the parent URL.
      const panel = document.getElementById('panel');
      panel.srcdoc = new TextDecoder().decode(html);
      panel.hidden = false;
      document.getElementById('gate').hidden = true;
      document.getElementById('access').value = '';
      if (location.hash !== '#key=' + token) history.replaceState(null, '', '#key=' + token);
      // Keep the access key in the trusted outer viewer, outside the isolated content.
      document.querySelectorAll('[data-document]').forEach(link => {
        const url = new URL(link.dataset.document, location.href);
        url.hash = 'key=' + token;
        link.href = url.href;
        if (location.pathname.endsWith(link.dataset.document) || (link.dataset.document === 'index.html' && location.pathname.endsWith('/'))) link.setAttribute('aria-current', 'page');
      });
      document.getElementById('documents').hidden = false;
    } catch (error) {
      status.textContent = error.message === 'browser' ? '请用最新版 Safari 或 Chrome 打开这个 HTTPS 链接。' : '请使用包含访问密钥的完整专属链接。';
      form.hidden = false;
    }
  }
  form.addEventListener('submit', event => { event.preventDefault(); openPanel(document.getElementById('access').value.trim()); });
  openPanel(new URLSearchParams(location.hash.slice(1)).get('key'));
})();
</script>
